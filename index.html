<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đánh giá dịch vụ</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom))
        20px;

      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin: 0 0 10px 0;
    }

    .description {
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .star {
      font-size: 35px;
      border: none;
      background: transparent;
      cursor: pointer;
      opacity: 0.35;
      padding: 5px;
    }

    .star.selected {
      opacity: 1;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;

      border-radius: 10px;
      border: 1px solid #ccc;

      font-size: 16px;
      font-family: Arial, sans-serif;

      resize: vertical;

      background: var(--tg-theme-secondary-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }

    button.submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;

      border: none;
      border-radius: 10px;

      background: #2481cc;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button.submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.submit:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>⭐ Đánh giá dịch vụ</h2>

    <div class="description">
      Bạn hài lòng với dịch vụ hỗ trợ khách hàng của chúng tôi ở mức nào?
    </div>

    <div class="stars">

      <button class="star" data-score="1">⭐</button>
      <button class="star" data-score="2">⭐</button>
      <button class="star" data-score="3">⭐</button>
      <button class="star" data-score="4">⭐</button>
      <button class="star" data-score="5">⭐</button>

    </div>

    <textarea
      id="feedback"
      placeholder="Nhập thêm cảm nhận của bạn..."
    ></textarea>

    <button
      id="submitButton"
      class="submit"
      onclick="submitFeedback()"
    >
      Gửi đánh giá
    </button>

  </div>


  <script>

    // ==============================
    // TELEGRAM MINI APP
    // ==============================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==============================
    // N8N WEBHOOK
    // ==============================

    const N8N_WEBHOOK_URL =
      "https://dbg9.app.n8n.cloud/webhook/telegram-csat";


    // ==============================
    // CHỌN SỐ SAO
    // ==============================

    let selectedScore = 0;

    const stars =
      document.querySelectorAll(".star");


    stars.forEach(star => {

      star.addEventListener("click", () => {

        selectedScore =
          Number(star.dataset.score);

        stars.forEach(s => {

          s.classList.remove("selected");

        });


        stars.forEach(s => {

          if (
            Number(s.dataset.score)
            <= selectedScore
          ) {

            s.classList.add("selected");

          }

        });

      });

    });


    // ==============================
    // GỬI ĐÁNH GIÁ
    // ==============================

    async function submitFeedback() {

      const feedback =
        document
          .getElementById("feedback")
          .value
          .trim();


      // Kiểm tra số sao

      if (selectedScore === 0) {

        alert("Vui lòng chọn số sao.");

        return;

      }


      // Nút gửi

      const submitButton =
        document.getElementById(
          "submitButton"
        );


      submitButton.disabled = true;

      submitButton.innerText =
        "Đang gửi...";


      // ==============================
      // LẤY THÔNG TIN TELEGRAM
      // ==============================

      const user =
        tg.initDataUnsafe?.user;


      const telegramChatId =
        user?.id
          ? String(user.id)
          : "";


      const telegramUsername =
        user?.username
          ? user.username
          : "";


      const firstName =
        user?.first_name
          ? user.first_name
          : "";


      const lastName =
        user?.last_name
          ? user.last_name
          : "";


      // ==============================
      // DỮ LIỆU GỬI SANG N8N
      // ==============================

      const data = {

        score: selectedScore,

        feedback: feedback,

        telegram_chat_id:
          telegramChatId,

        telegram_username:
          telegramUsername,

        customer_name:
          `${firstName} ${lastName}`.trim(),

        submitted_at:
          new Date().toISOString()

      };


      console.log(
        "CSAT data:",
        data
      );


      // ==============================
      // GỬI POST ĐẾN N8N
      // ==============================

      try {

        const response =
          await fetch(
            N8N_WEBHOOK_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify(data)

            }
          );


        // Nếu n8n trả lỗi

        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            "N8N Error:",
            errorText
          );

          throw new Error(
            "N8N trả về lỗi " +
            response.status
          );

        }


        // ==============================
        // THÀNH CÔNG
        // ==============================

        alert(
          "Cảm ơn bạn đã gửi đánh giá!"
        );


        // Đóng Mini App

        tg.close();


      } catch (error) {

        console.error(
          "Submit error:",
          error
        );


        alert(
          "Không thể gửi đánh giá. " +
          "Vui lòng thử lại."
        );


        // Cho phép gửi lại

        submitButton.disabled =
          false;

        submitButton.innerText =
          "Gửi đánh giá";

      }

    }

  </script>

</body>
</html>
